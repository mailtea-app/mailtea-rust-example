[package]
name = "mailtea-rust-example"
version = "0.1.0"
edition = "2021"
# The SDK's floor, and therefore this example's.
rust-version = "1.75"
license = "MIT"
publish = false

[dependencies]
# The official Mailtea Rust SDK. Switch to the registry form —
# `mailtea = "0.1"` — once the crate is published to crates.io.
mailtea = { git = "https://github.com/mailtea-app/mailtea-rust", tag = "v0.1.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Only used to stamp an RFC 3339 `scheduled_at`.
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
# Loads .env in development. Production sets real environment variables.
dotenvy = "0.15"

[dev-dependencies]
# The tests serve their own mock Mailtea over a tokio TcpListener, so they add
# no HTTP framework and make no network calls.
tokio = { version = "1", features = ["net", "io-util"] }
serde_json = "1"
